services:
  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-password}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:7474"]
      interval: 10s
      retries: 10

  app:
    build: .
    ports:
      - "5000:5000"
    env_file: .env
    environment:
      NEO4J_URI: neo4j://neo4j:7687
    depends_on:
      neo4j:
        condition: service_healthy

volumes:
  neo4j_data:
